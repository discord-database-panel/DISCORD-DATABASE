
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM DATABASE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #313338;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
    }

    .card {
      width: 365px;
      padding: 34px 30px 30px;
      background: #2b2d31;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
      text-align: center;
    }

    .logo {
      width: 74px;
      height: 74px;
      margin: 0 auto 34px;
      border-radius: 8px;
      background: #5865f2;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1 {
      margin: 0 0 26px;
      font-size: 24px;
    }

    form {
      text-align: left;
    }

    label {
      display: block;
      margin: 0 0 6px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 45px;
      margin-bottom: 15px;
      padding: 0 14px;
      border: 0;
      outline: none;
      border-radius: 6px;
      background: #1e1f22;
      color: white;
      font-size: 14px;
    }

    input::placeholder {
      color: #777b84;
    }

    button {
      width: 100%;
      height: 47px;
      margin-top: 8px;
      border: 0;
      border-radius: 7px;
      background: #5865f2;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #4752c4;
    }

    .notice {
      margin: 14px 3px 0;
      text-align: center;
      color: #d7d9dc;
      font-size: 12px;
      line-height: 1.4;
    }

    .success {
      display: none;
      margin-top: 14px;
      padding: 10px;
      border-radius: 6px;
      background: #1e1f22;
      color: #b5bac1;
      text-align: center;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="card">

    <div class="logo">
      <img
        src="https://media.discordapp.net/attachments/1547645587430580284/1547646018856812564/XIdrXQAAAABJRU5ErkJggg.png?ex=6aa42d2c&is=6aa2dbac&hm=909d8b196c236a6858e97c77a3ae29f3ed019f91c45c564de91795f6d3cb4092&=&format=webp&quality=lossless"
        alt="Discord shield logo"
      >
    </div>

    <h1>Database</h1>

    <form id="demoForm">

      <label for="name">Demo Name</label>
      <input
        id="name"
        name="name"
        type="text"
        placeholder="Enter demo name"
        autocomplete="off"
        required
      >

      <label for="reference">Test Reference</label>
      <input
        id="reference"
        name="reference"
        type="text"
        placeholder="DEMO-001"
        autocomplete="off"
        required
      >

      <label for="amount">Test Amount</label>
      <input
        id="amount"
        name="amount"
        type="number"
        placeholder="0.00"
        min="0"
        step="0.01"
        required
      >

      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="demo@example.com"
        required
      >

      <button type="submit">Submit Demo</button>

      <p class="notice">
        School demo only. Use fictional information.
        No card numbers, expiration dates, or CVVs are collected.
      </p>

      <div class="success" id="success"></div>

    </form>
  </main>

  <script>
    document.getElementById("demoForm").addEventListener("submit", function (event) {
      event.preventDefault();

      const name = document.getElementById("name").value;
      const reference = document.getElementById("reference").value;
      const amount = document.getElementById("amount").value;
      const email = document.getElementById("email").value;

      const subject = "School Demo Submission";

      const body = [
        "SYSTEM DATABASE - School Demo",
        "",
        `Demo Name: ${name}`,
        `Test Reference: ${reference}`,
        `Test Amount: ${amount}`,
        `Email: ${email}`,
        "",
        "This is fictional test information."
      ].join("\n");

      // Opens a new email draft. The user must send it manually.
      window.location.href =
        `mailto:rollsoguba@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

      document.getElementById("success").textContent =
        "Your email app should open with the demo details ready to send.";

      document.getElementById("success").style.display = "block";

      this.reset();
    });
  </script>
</body>
</html>
