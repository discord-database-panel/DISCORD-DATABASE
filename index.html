<form id="demoForm">
  <label for="name">Name</label>
  <input id="name" type="text" required>

  <label for="studentId">Student ID</label>
  <input id="studentId" type="text" required>

  <label for="section">Section</label>
  <input id="section" type="text" required>

  <label for="email">Email</label>
  <input id="email" type="email" required>

  <button type="submit">Submit</button>
</form>

<script>
document.getElementById("demoForm").addEventListener("submit", function(event) {
  event.preventDefault();

  const name = document.getElementById("name").value;
  const studentId = document.getElementById("studentId").value;
  const section = document.getElementById("section").value;
  const email = document.getElementById("email").value;

  const subject = "School Demo Submission";

  const body = [
    "New school demo submission",
    "",
    `Name: ${name}`,
    `Student ID: ${studentId}`,
    `Section: ${section}`,
    `Email: ${email}`
  ].join("\n");

  window.location.href =
    `mailto:rollsoguba@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
});
</script>
